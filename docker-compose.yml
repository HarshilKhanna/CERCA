version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Network shared by ALL containers
# ─────────────────────────────────────────────────────────────────────────────
networks:
  social-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volumes for persistent data
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  prometheus_data: {}

# ─────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY SERVICES
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ---------------------------------------------------------------------------
  # Jaeger All-In-One  (collector + query + UI in a single container)
  # UI:        http://localhost:16686
  # Collector: UDP 6831 (compact thrift), HTTP 14268 (thrift binary)
  # Metrics:   http://jaeger:14269/metrics  (scraped by Prometheus)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    hostname: jaeger
    restart: always
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=200000
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - social-network

  # ---------------------------------------------------------------------------
  # cAdvisor  — per-container CPU / memory / network metrics
  # Metrics:   http://localhost:8088/metrics  (scraped by Prometheus)
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    hostname: cadvisor
    restart: always
    privileged: true
    # NOTE: On Windows, cAdvisor requires WSL2 backend with Docker socket exposed.
    # If cAdvisor fails to start, it can be disabled — Jaeger traces still work.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8088:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - social-network
    depends_on:
      - jaeger

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes cAdvisor + Jaeger metrics
  # UI:         http://localhost:9090
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    hostname: prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - social-network
    depends_on:
      - cadvisor
      - jaeger

  # ─────────────────────────────────────────────────────────────────────────
  # DEATHSTARBENCH — SOCIAL NETWORK MICROSERVICES
  # All services mount ./config so they pick up jaeger-config.yml
  # All services get JAEGER_AGENT_HOST/PORT env vars pointing to jaeger container
  # ─────────────────────────────────────────────────────────────────────────

  # ---------------------------------------------------------------------------
  # nginx front-end (Thrift RPC gateway)
  # HTTP:  http://localhost:8080
  # ---------------------------------------------------------------------------
  nginx-thrift:
    image: yg397/openresty-thrift:xenial
    container_name: nginx-thrift
    hostname: nginx-thrift
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - jaeger
      - user-service
      - compose-post-service
      - home-timeline-service
      - user-timeline-service
      - url-shorten-service
      - user-mention-service
      - media-service
      - text-service
      - social-graph-service
      - post-storage-service
    # Volumes sourced from dsb/ (populated by scripts/setup_dsb.ps1)
    volumes:
      - ./dsb/socialNetwork/nginx-web-server/lua-scripts:/usr/local/openresty/nginx/lua-scripts
      - ./dsb/socialNetwork/nginx-web-server/pages:/usr/local/openresty/nginx/pages
      - ./dsb/socialNetwork/nginx-web-server/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./dsb/socialNetwork/nginx-web-server/jaeger-config.json:/usr/local/openresty/nginx/jaeger-config.json
      - ./dsb/socialNetwork/gen-lua:/gen-lua
      - ./dsb/socialNetwork/docker/openresty-thrift/zookeeper.ini:/etc/zookeeper/zookeeper.ini
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - social-network

  # ---------------------------------------------------------------------------
  # Social Graph Service
  # ---------------------------------------------------------------------------
  social-graph-service:
    image: deathstarbench/social-network-microservices:latest
    container_name: social-graph-service
    hostname: social-graph-service
    restart: always
    entrypoint: SocialGraphService
    environment:
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - jaeger
      - social-graph-mongodb
      - social-graph-redis
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./config:/social-network-microservices/config
    networks:
      - social-network

  social-graph-mongodb:
    image: mongo:4.4.6
    container_name: social-graph-mongodb
    hostname: social-graph-mongodb
    restart: always
    networks:
      - social-network

  social-graph-redis:
    image: redis:6.2-alpine
    container_name: social-graph-redis
    hostname: social-graph-redis
    restart: always
    networks:
      - social-network

  # ---------------------------------------------------------------------------
  # Home Timeline Service
  # ---------------------------------------------------------------------------
  home-timeline-redis:
    image: redis:6.2-alpine
    container_name: home-timeline-redis
    hostname: home-timeline-redis
    restart: always
